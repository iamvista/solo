<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#F8F6F3"/>

  <!-- Central trust structure -->
  <!-- Top: Family -->
  <g transform="translate(170, 30)">
    <circle cx="30" cy="18" r="18" fill="#1E3A5F" opacity="0.08" stroke="#1E3A5F" stroke-width="1.5"/>
    <!-- Parent figure -->
    <circle cx="23" cy="14" r="5" fill="#1E3A5F" opacity="0.4"/>
    <path d="M15 28 C15 22 23 18 23 18 C23 18 31 22 31 28" fill="#1E3A5F" opacity="0.2"/>
    <!-- Child figure -->
    <circle cx="37" cy="16" r="4" fill="#C8953D" opacity="0.5"/>
    <path d="M31 27 C31 23 37 20 37 20 C37 20 43 23 43 27" fill="#C8953D" opacity="0.2"/>
  </g>
  <text x="200" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#1E3A5F" font-weight="500" text-anchor="middle">委託人（你）</text>

  <!-- Arrow down -->
  <line x1="200" y1="75" x2="200" y2="100" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="195,98 200,108 205,98" fill="#1E3A5F"/>

  <!-- Trust box (center) -->
  <rect x="130" y="110" width="140" height="55" rx="10" fill="#1E3A5F" opacity="0.06" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="133" y="113" width="134" height="49" rx="8" fill="white"/>
  <!-- Shield inside trust -->
  <path d="M192 122 L208 122 L210 125 L210 140 C210 148 200 153 200 153 C200 153 190 148 190 140 L190 125 Z"
        fill="#C8953D" opacity="0.15" stroke="#C8953D" stroke-width="1.2"/>
  <path d="M196 135 L199 138 L205 131" stroke="#C8953D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#1E3A5F" font-weight="600" text-anchor="middle" dy="10">信託架構</text>

  <!-- Three arrows going down from trust -->
  <!-- Left arrow -->
  <line x1="158" y1="165" x2="120" y2="195" stroke="#C8953D" stroke-width="1.5"/>
  <polygon points="116,191 122,198 126,190" fill="#C8953D"/>

  <!-- Center arrow -->
  <line x1="200" y1="165" x2="200" y2="195" stroke="#C8953D" stroke-width="1.5"/>
  <polygon points="195,193 200,203 205,193" fill="#C8953D"/>

  <!-- Right arrow -->
  <line x1="242" y1="165" x2="280" y2="195" stroke="#C8953D" stroke-width="1.5"/>
  <polygon points="274,190 278,198 284,191" fill="#C8953D"/>

  <!-- Three outcome boxes -->
  <!-- Left: Medical care -->
  <rect x="80" y="200" width="80" height="48" rx="8" fill="white" stroke="#1E3A5F" stroke-width="1.2"/>
  <text x="120" y="222" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🏥</text>
  <text x="120" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#1E3A5F" font-weight="500" text-anchor="middle">醫療照護</text>

  <!-- Center: Living expenses -->
  <rect x="170" y="200" width="60" height="48" rx="8" fill="white" stroke="#1E3A5F" stroke-width="1.2"/>
  <text x="200" y="222" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🏠</text>
  <text x="200" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#1E3A5F" font-weight="500" text-anchor="middle">生活保障</text>

  <!-- Right: Inheritance -->
  <rect x="240" y="200" width="80" height="48" rx="8" fill="white" stroke="#1E3A5F" stroke-width="1.2"/>
  <text x="280" y="222" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">👨‍👩‍👧‍👦</text>
  <text x="280" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#1E3A5F" font-weight="500" text-anchor="middle">傳承安排</text>

  <!-- Title -->
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="16" fill="#1E3A5F" font-weight="600" text-anchor="middle">讓計畫真正被執行</text>
  <text x="200" y="293" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">透過信託制度落實你的安排</text>
</svg>
